{{ $hero := .Params.hero }}
{{ $subtitle := $hero.subtitle }}
{{ $excerpt := $hero.excerpt }}
{{ $img := $hero.image }}
{{ $alt := $hero.alt }}

<section class="hero-plant">
  <div class="hero__container">
    <div class="hero__grid">
      <div class="hero__content">
        <h1 class="hero__title">{{ $.Title }}</h1>
        {{ with $subtitle }}<p class="hero__subtitle">{{ . }}</p>{{ end }}
        {{ with $excerpt }}<div class="hero__excerpt">{{ . | markdownify }}</div>{{ end }}
      </div>
    </div>
  </div>

  {{ with $img }}
    <!-- Right-side image overlay that fills height and fades on the left -->
    <div class="hero-plant__image">
      <img src="{{ . }}" alt="{{ $alt }}">
    </div>
  {{ end }}
</section>

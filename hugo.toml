baseURL = 'https://leahwasser.com/'
languageCode = 'en-us'
title = 'Leah A Wasser'
theme = 'clean-hugo'

# Socials
[params.social]
  github = "https://github.com/lwasser"
  linkedin = "https://linkedin.com/in/leahawasser"
  mastodon = "https://fosstodon.org/@leahawasser"
  bluesky = "https://bsky.app/profile/leahawasser.bsky.social"
  orcid = "https://orcid.org/0000-0002-8177-6550"
  zenodo = "https://zenodo.org/communities/pyopensci"
  rss = "/index.xml"
  email = "mailto:leah+website@pyopensci.org"

params.licenseURL = "/license"

# Customize theme parameters here
[params]
  author = "Leah A. Wasser"
  tagline = "Empowering Communities to Advance Science Through Open, Equitable Practices"
  blog_title = "Building in the Open"

  # Blog listing configuration
  [params.blog]
    sidebar_count = 2  # Number of posts in sidebar (right column)
    excerpt_length = 200  # Character length for excerpts

# Theme configuration
[params.theme]
  # Enable/disable features
  enableGallery = true
  enableFontAwesome = true

  # Fonts (Google Fonts)
  [params.theme.fonts]
    heading = "Sora"
    body = "Inter"

  # Color customization (CSS variables)
  [params.theme.colors]
    primary = "#71B3B5"        # Verdigris (teal/cyan)
    primaryDark = "#2E6060"     # Darker verdigris
    primaryLight = "#D6E3E3"   # Light verdigris background
    secondary = "#EDB88B"      # Buff (warm peachy/tan)
    accent = "#42213D"        # Dark purple
    accentLight = "#AC87A0"    # Mountbatten pink
    neutral = "#395E66"        # Dark slate gray
    blogHighlight = "#111827"  # Blog highlight section background (RGB: 17, 24, 39)
    link = "#2E6060"           # Link color on light backgrounds - using primaryDark for WCAG AA accessibility
    linkOnDark = "#2DD4BF"     # Link color on dark backgrounds (RGB: 45, 212, 191) - lighter variant
    linkHover = "#1F4345"      # Link hover color - darker variant for better contrast
    footerBg = "#115E59"      # Footer background (RGB: 17, 94, 89)
    featureCard = "#EBC1D3"    # Feature section card background (RGB: 235, 193, 211)

# Gallery configuration
[params.gallery]
  otherTitle = "Other Hoyas"

# Footer configuration
[params.footer]
  title = "Let's Connect"

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 1

[[menu.main]]
  name = "Plants"
  url = "/plants/"
  weight = 2

